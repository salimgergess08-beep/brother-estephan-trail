services:
  - type: web
    name: brother-estephan-trail
    runtime: static
    buildCommand: echo 'Static site ready'
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
